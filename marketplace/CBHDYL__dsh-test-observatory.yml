url: https://github.com/CBHDYL/dsh-test-observatory
name: CBHDYL/dsh-test-observatory
category: tools
description:
  en: "Test runner and quality report for DSH: /test runs declared shell-command cases and browser journeys per persona, then writes one self-contained HTML report with pass/fail, screenshots, axe-core accessibility violations and a rule-based experience score."
  zh: "DSH 的测试执行与质量报告插件：/test 运行声明的 shell 命令用例与按角色划分的浏览器旅程，并生成一份自包含 HTML 报告，包含通过/失败、截图、axe-core 无障碍违规与规则化体验评分。"
